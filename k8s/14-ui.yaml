apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: ds-storage
spec:
  type: LoadBalancer
  selector: { app: ui }
  ports: [{ name: http, port: 3001, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: ds-storage
spec:
  replicas: 1
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui } }
    spec:
      containers:
        - name: ui
          image: ds-storage/ui:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_UPSTREAM, value: "gateway:8080" }
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
