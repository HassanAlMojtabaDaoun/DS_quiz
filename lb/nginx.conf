# Load balancer in front of the gateway instances.
#   least_conn  : send each request to the gateway with fewest active
#                 connections (long uploads/downloads do not pile up)
#   max_fails / fail_timeout : passive health checking - a gateway that
#                 fails 3 times is skipped for 10 s
#   proxy_next_upstream : a request that cannot reach one gateway is
#                 retried on the other (only for idempotent methods)
upstream gateways {
    least_conn;
    server gateway-1:8080 max_fails=3 fail_timeout=10s;
    server gateway-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 0;

    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        add_header X-Upstream $upstream_addr always;
    }
}
