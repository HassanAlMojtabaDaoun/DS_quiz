
services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "ChangeMe-123!"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storage
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
    volumes:
      - storage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage -d storage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage-node-1:
    build: .
    command: ["uvicorn", "storage_node.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      NODE_ID: node1
      STORAGE_DIR: /data
      CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
      METADATA_URL: http://storage-coordinator:8000
      HEARTBEAT_INTERVAL: "5"
    volumes:
      - storage-node-1-data:/data
    restart: unless-stopped

  storage-node-2:
    build: .
    command: ["uvicorn", "storage_node.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      NODE_ID: node2
      STORAGE_DIR: /data
      CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
      METADATA_URL: http://storage-coordinator:8000
      HEARTBEAT_INTERVAL: "5"
    volumes:
      - storage-node-2-data:/data
    restart: unless-stopped

  storage-node-3:
    build: .
    command: ["uvicorn", "storage_node.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      NODE_ID: node3
      STORAGE_DIR: /data
      CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
      METADATA_URL: http://storage-coordinator:8000
      HEARTBEAT_INTERVAL: "5"
    volumes:
      - storage-node-3-data:/data
    restart: unless-stopped

  storage-node-4:
    build: .
    command: ["uvicorn", "storage_node.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      NODE_ID: node4
      STORAGE_DIR: /data
      CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
      METADATA_URL: http://storage-coordinator:8000
      HEARTBEAT_INTERVAL: "5"
    volumes:
      - storage-node-4-data:/data
    restart: unless-stopped

  storage-coordinator:
    build: .
    command: ["uvicorn", "coordinator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://storage:${DB_PASSWORD:-dev-password-change-me}@postgres:5432/storage
      CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
      NODE_URLS: node1=http://storage-node-1:8000,node2=http://storage-node-2:8000,node3=http://storage-node-3:8000,node4=http://storage-node-4:8000
      HEARTBEAT_TIMEOUT: "15"
      CHUNK_SIZE: "4194304"
      REPLICATION_FACTOR: "3"
      MAX_FILE_SIZE: "1073741824"
    depends_on:
      postgres:
        condition: service_healthy
      storage-node-1:
        condition: service_started
      storage-node-2:
        condition: service_started
      storage-node-3:
        condition: service_started
      storage-node-4:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  kafka-data:
  rabbitmq-data:
  storage-postgres-data:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
  storage-node-4-data:
