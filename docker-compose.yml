# Distributed object storage - complete local deployment.
#
#   clients / UI --> lb (nginx :8080) --> gateway-1, gateway-2
#                                           |
#                                     storage-coordinator --- postgres
#                                      |        |     \--- elasticsearch
#                          kafka (job queue)   storage-node-1..4 (+5,6)
#                                      |
#                                   worker x2   (repair / rebalance / gc)
#   monitoring: prometheus (:9090) + grafana (:3000)
#
# docker compose up --build -d
# docker compose --profile scale up -d storage-node-5   (auto-joins, rebalances)

x-node: &storage-node
  build: { context: ., dockerfile: docker/storage-node.Dockerfile }
  image: ds-storage/storage-node:1.0
  restart: unless-stopped

x-node-env: &storage-node-env
  STORAGE_DIR: /data
  CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
  METADATA_URL: http://storage-coordinator:8000
  HEARTBEAT_INTERVAL: "5"
  SCRUB_INTERVAL: "300"
  ALLOW_FAULT_INJECTION: "true"

x-gateway: &gateway
  build: { context: ., dockerfile: docker/gateway.Dockerfile }
  image: ds-storage/gateway:1.0
  depends_on:
    - storage-coordinator
  restart: unless-stopped

x-gateway-env: &gateway-env
  COORDINATOR_URL: http://storage-coordinator:8000
  CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
  PRESIGN_SECRET: ${PRESIGN_SECRET:-dev-presign-secret-change-me}
  RATE_LIMIT_RPS: "20"
  RATE_LIMIT_BURST_FACTOR: "2"
  CORS_ORIGINS: "*"

x-backend-env: &backend-env
  DATABASE_URL: postgresql://storage:${DB_PASSWORD:-dev-password-change-me}@postgres:5432/storage
  CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-cluster-token-change-me}
  NODE_URLS: node1=http://storage-node-1:8000,node2=http://storage-node-2:8000,node3=http://storage-node-3:8000,node4=http://storage-node-4:8000
  HEARTBEAT_TIMEOUT: "15"
  CHUNK_SIZE: "4194304"
  REPLICATION_FACTOR: "3"
  WRITE_QUORUM: "2"
  READ_QUORUM: "2"
  EC_K: "4"
  EC_M: "2"
  EC_BACKEND: zfec
  JOB_BACKEND: kafka
  KAFKA_BOOTSTRAP: kafka:9092

services:
  # ---------------------------------------------------------------- data stores
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storage
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
    volumes:
      - storage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage -d storage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Job queue for repair / rebalance / garbage-collection batches.
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "29092:29092"          # for tools on the host (localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6              # spreads batches over workers
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ------------------------------------------------------------- storage nodes
  storage-node-1:
    <<: *storage-node
    environment: { <<: *storage-node-env, NODE_ID: node1, NODE_URL: "http://storage-node-1:8000" }
    volumes: [storage-node-1-data:/data]
  storage-node-2:
    <<: *storage-node
    environment: { <<: *storage-node-env, NODE_ID: node2, NODE_URL: "http://storage-node-2:8000" }
    volumes: [storage-node-2-data:/data]
  storage-node-3:
    <<: *storage-node
    environment: { <<: *storage-node-env, NODE_ID: node3, NODE_URL: "http://storage-node-3:8000" }
    volumes: [storage-node-3-data:/data]
  storage-node-4:
    <<: *storage-node
    environment: { <<: *storage-node-env, NODE_ID: node4, NODE_URL: "http://storage-node-4:8000" }
    volumes: [storage-node-4-data:/data]
  # Extra nodes (not started by default). They join the ring by themselves
  # (AUTO_JOIN) and a rebalance job moves their share of the data to them:
  #   docker compose --profile scale up -d storage-node-5 storage-node-6
  storage-node-5:
    <<: *storage-node
    profiles: ["scale"]
    environment: { <<: *storage-node-env, NODE_ID: node5, NODE_URL: "http://storage-node-5:8000" }
    volumes: [storage-node-5-data:/data]
  storage-node-6:
    <<: *storage-node
    profiles: ["scale"]
    environment: { <<: *storage-node-env, NODE_ID: node6, NODE_URL: "http://storage-node-6:8000" }
    volumes: [storage-node-6-data:/data]

  # ------------------------------------------------- metadata service + workers
  storage-coordinator:
    build: { context: ., dockerfile: docker/coordinator.Dockerfile }
    image: ds-storage/coordinator:1.0
    ports:
      - "8000:8000"            # internal API (CLI, scripts); users use :8080
    environment:
      <<: *backend-env
      VNODES: "128"
      DEFAULT_CHUNKING: fixed
      MAX_FILE_SIZE: "1073741824"
      REPAIR_INTERVAL: "10"
      LOCAL_WORKERS: "0"       # the worker containers do the jobs
      AUTO_JOIN: "true"
      REBALANCE_DELAY: "15"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      ES_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: ds-storage/worker:1.0
    deploy:
      replicas: 2              # consumer group members share the batches
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: "2"
    depends_on:
      - storage-coordinator
      - kafka
    restart: unless-stopped

  # --------------------------------------------- gateways + load balancer + UI
  gateway-1:
    <<: *gateway
    environment: { <<: *gateway-env, GATEWAY_ID: gateway-1 }
  gateway-2:
    <<: *gateway
    environment: { <<: *gateway-env, GATEWAY_ID: gateway-2 }

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"              # the public API endpoint
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
    restart: unless-stopped

  ui:
    build: ./ui
    image: ds-storage/ui:1.0
    ports:
      - "3001:80"
    environment:
      API_UPSTREAM: lb:80
    depends_on:
      - lb
    restart: unless-stopped

  # ----------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "ChangeMe-123!"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/storage.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  storage-postgres-data:
  elasticsearch-data:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
  storage-node-4-data:
  storage-node-5-data:
  storage-node-6-data:
